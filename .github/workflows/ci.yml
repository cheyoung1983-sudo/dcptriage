name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Secret scan
        run: node scripts/check-secrets.mjs
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
